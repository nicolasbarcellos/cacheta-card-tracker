<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Overlay</title>
<style>
  /* fundo transparente para o OBS Browser Source */
  body { margin: 0; background: transparent; font-family: Arial, sans-serif; }
  .mao {
    display: flex; align-items: flex-end; padding: 20px 24px;
    /* leque: as cartas se sobrepõem como na mão do jogador */
    margin-left: 0;
  }
  .mao img {
    width: 120px; display: block; border-radius: 6px;
    margin-left: -46px;               /* sobreposição */
    filter: drop-shadow(0 4px 10px rgba(0,0,0,.6));
    animation: entrada .25s ease-out;  /* carta que chega desliza para o lugar */
  }
  .mao img:first-child { margin-left: 0; }
  @keyframes entrada {
    from { transform: translateY(-18px); opacity: 0; }
    to   { transform: none; opacity: 1; }
  }
  .contagem {
    position: fixed; left: 24px; bottom: 8px;
    color: #fff; font-size: 18px; font-weight: bold;
    text-shadow: 0 2px 4px rgba(0,0,0,.8);
  }
</style>
</head>
<body>
<!-- A saída deste modelo é a MÃO. Compra e descarte saíram do overlay em
     2026-08-19: viraram responsabilidade de outros modelos, com outras
     câmeras, e mostrar aqui um palpite que este não faz mais seria mentira. -->
<div class="mao" id="mao"></div>
<div class="contagem" id="contagem"></div>
<script>
  let mostrado = '';

  function render(hand) {
    // só redesenha quando a mão muda DE FATO: redesenhar todo frame reinicia a
    // animação de entrada e faz o leque piscar no OBS
    const chave = hand.map(c => c.code).join(',');
    if (chave === mostrado) return;
    mostrado = chave;
    document.getElementById('mao').innerHTML = hand.map(c =>
      `<img src="/assets/cards/${c.asset}" alt="${c.display}">`).join('');
    document.getElementById('contagem').textContent =
      hand.length ? `${hand.length} cartas` : '';
  }

  function connect() {
    const ws = new WebSocket(`ws://${location.host}/ws`);
    ws.onmessage = (msg) => {
      const state = JSON.parse(msg.data);
      if (state.type !== 'state') return;
      render(state.hand || []);
    };
    ws.onclose = () => setTimeout(connect, 1000);  // reconecta sozinho
  }
  connect();
</script>
</body>
</html>
